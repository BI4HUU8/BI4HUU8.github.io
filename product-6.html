<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Червоний дитячий купальник</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #25211f;
            background: #fff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            width: 100%;
            min-height: 100%;
            max-width: 1280px;
            margin: 0 auto;
        }

        h1, h2, h3, h4, h5, h6 {
              text-align: center;
        }

        .product-grid {
            margin: 0 0 48px;
            padding: 0 32px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 28px 20px;
        }

        .product-card {
            display: block;
            color: inherit;
            text-decoration: none;
        }

        .product-card__images {
            position: relative;
            display: block;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            background: #f5f1ef;
        }

        .product-card__image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 200ms ease;
        }

        .product-card__image--hover {
            opacity: 0;
        }

        .product-card:hover .product-card__image--hover,
        .product-card:focus-visible .product-card__image--hover {
            opacity: 1;
        }

        .product-card__name,
        .product-card__meta {
            display: block;
            margin-top: 10px;
        }

        .product-card__name {
            font-weight: 600;
        }

        .product-card__meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 5px;
        }

        .product-card__price,
        .product-card__art {
            color: #6b625e;
        }

        .product-card__art {
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: lowercase;
        }

        .product-page {
            margin: 0;
            padding: 28px 32px 64px;
        }

        .product-page__back {
            color: #6b625e;
            text-decoration: none;
        }

        .product-page h1 {
            margin: 24px 0;
        }

        .product-page__layout {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(240px, 0.8fr);
            gap: 48px;
        }

        .product-slider {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .product-slider > input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .product-slider__main {
            position: relative;
            overflow: hidden;
            aspect-ratio: 3 / 4;
            background: #f5f1ef;
        }

        .product-slider__slide {
            display: none;
            position: absolute;
            inset: 0;
        }

        .product-slider__slide > a {
            display: block;
            width: 100%;
            height: 100%;
            cursor: zoom-in;
        }

        .product-slider__slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-slider > input:nth-of-type(1):checked ~ .product-slider__main .product-slider__slide--first,
        .product-slider > input:nth-of-type(2):checked ~ .product-slider__main .product-slider__slide--second {
            display: block;
        }

        .product-slider__arrow,
        .product-fullscreen__arrow {
            display: grid;
            place-items: center;
            width: 60px;
            height: 60px;
            padding-bottom: 5px;
            border-radius: 50%;
            color: #25211f;
            background: rgba(255, 255, 255, 0.9);
            font-size: 40px;
            line-height: 1;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
        }

        .product-slider__arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .product-slider__arrow--previous,
        .product-fullscreen__arrow--previous {
            left: 14px;
        }

        .product-slider__arrow--next,
        .product-fullscreen__arrow--next {
            right: 14px;
        }

        .product-fullscreen {
            display: none;
        }

        .product-fullscreen:target {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px;
            background: rgba(0, 0, 0, 0.94);
        }

        .product-fullscreen > img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .product-fullscreen__close {
            position: absolute;
            top: 18px;
            right: 24px;
            color: #fff;
            font-size: 36px;
            line-height: 1;
            text-decoration: none;
        }

        .product-fullscreen__arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .product-slider__thumbnails {
            display: flex;
            gap: 10px;
        }

        .product-slider__thumbnails label {
            width: 72px;
            height: 96px;
            cursor: pointer;
            opacity: 0.65;
        }

        .product-slider__thumbnails label:hover,
        .product-slider > input:nth-of-type(1):checked ~ .product-slider__thumbnails label:nth-of-type(1),
        .product-slider > input:nth-of-type(2):checked ~ .product-slider__thumbnails label:nth-of-type(2) {
            opacity: 1;
        }

        .product-slider__thumbnails img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-page__price {
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .product-page__art {
            color: #6b625e;
        }

        .site-header {
            border-bottom: 1px solid #eee8e5;
            background: #fff;
        }

        .header-inner {
            padding: 22px 32px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 28px;
        }

        .brand {
            justify-self: start;
            color: inherit;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-decoration: none;
        }

        .category-nav,
        .info-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .category-nav {
            justify-self: center;
        }

        .info-nav {
            justify-self: end;
            gap: 18px;
        }

        .site-header a:not(.brand) {
            color: inherit;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: color 160ms ease;
        }

        .site-header a:hover {
            color: #a45c68;
        }

        .category-nav a {
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        @media (max-width: 900px) {
            .header-inner {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .brand {
                grid-column: 1 / -1;
                justify-self: center;
            }

            .category-nav {
                grid-column: 1 / -1;
                grid-row: 2;
                justify-self: center;
                order: 1;
            }

            .info-nav {
                grid-column: 1 / -1;
                grid-row: 3;
                justify-self: center;
                flex-wrap: wrap;
            }
        }

        @media (max-width: 520px) {
            .product-grid {
                padding: 0 18px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 22px 12px;
            }

            .header-inner {
                padding: 20px 18px;
                gap: 18px 12px;
            }

            .brand {
                font-size: 23px;
            }

            .category-nav,
            .info-nav {
                gap: 12px 18px;
                flex-wrap: wrap;
            }

            .site-header a:not(.brand) {
                font-size: 12px;
            }

            .product-page {
                padding: 24px 18px 48px;
            }

            .product-page__layout {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="index.html" aria-label="Bikini — на головну">BIKINI</a>
            <nav class="category-nav" aria-label="Категорії товарів">
                <a href="women.html">Жінкам</a>
                <a href="children.html">Дітям</a>
            </nav>
            <nav class="info-nav" aria-label="Інформація">
                <a href="#about">Про нас</a>
                <a href="#delivery">Доставка</a>
                <a href="#payment">Оплата</a>
                <a href="#contacts">Контакти</a>
                <a href="#sale">Акції</a>
            </nav>
        </div>
    </header>
<main id="product-page-6" class="product-page">

                <div class="product-slider__slide product-slider__slide--second">

            </div>
            <div id="product-fullscreen-6-2" class="product-fullscreen">
                <a class="product-fullscreen__close" href="#product-page-6" aria-label="Закрити">×</a>

                <img src="img/kids/r/2.webp" alt="Червоний дитячий купальник — фото 2">
                <a class="product-fullscreen__arrow product-fullscreen__arrow--next" href="#product-fullscreen-6-1" aria-label="Наступне фото">›</a>
            </div>
        </section>
        <section class="product-page__details" aria-label="Інформація про товар">
            <p class="product-page__price">$89.99</p>

        </section>
    </div>
</main></body>
</html>
